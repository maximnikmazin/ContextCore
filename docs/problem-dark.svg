" y="220" width="188" height="84" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="268" y="250" font-size="15" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="268" dy="0">Notes app</tspan></text><rect x="268" y="264" width="92" height="26" rx="13" fill="#3a1414" stroke="none"/><text x="314" y="281.5" font-size="12.5" font-weight="500" fill="#ff6961" text-anchor="middle" letter-spacing="0"><tspan x="314" dy="0">your vault</tspan></text><circle cx="56" cy="348" r="3.5" fill="#ff6961"/><text x="70" y="352" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="70" dy="0">You repeat the same facts in every app</tspan></text><circle cx="56" cy="378" r="3.5" fill="#ff6961"/><text x="70" y="382" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="70" dy="0">A rule you fix in one app stays old in the others</tspan></text><circle cx="56" cy="408" r="3.5" fill="#ff6961"/><text x="70" y="412" font-size="13.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="70" dy="0">Memory piles up; nobody cleans it</tspan></text><rect x="492" y="24" width="444" height="422" rx="18" fill="#0f0f12" stroke="#27272a" stroke-width="1"  /><text x="516" y="58" font-size="11" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="516" dy="0">WITH CONTEXTCORE</tspan></text><text x="516" y="84" font-size="21" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="-0.3"><tspan x="516" dy="0">One memory, on your server</tspan></text><rect x="516" y="112" width="93" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="562.5" y="137" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="middle" letter-spacing="0"><tspan x="562.5" dy="0">Claude</tspan></text><path d="M562.5 156 L562.5 196" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="617" y="112" width="93" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="663.5" y="137" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="middle" letter-spacing="0"><tspan x="663.5" dy="0">ChatGPT</tspan></text><path d="M663.5 156 L663.5 196" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="718" y="112" width="93" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="764.5" y="137" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="middle" letter-spacing="0"><tspan x="764.5" dy="0">Coding agent</tspan></text><path d="M764.5 156 L764.5 196" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="819" y="112" width="93" height="40" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="865.5" y="137" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="middle" letter-spacing="0"><tspan x="865.5" dy="0">Any MCP app</tspan></text><path d="M865.5 156 L865.5 196" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><text style="paint-order:stroke" stroke="#0f0f12" stroke-width="6" x="714" y="182" font-size="11.5" font-weight="500" fill="#5eb0ff" text-anchor="middle" letter-spacing="0"><tspan x="714" dy="0">reads at start · saves as it works</tspan></text><rect x="516" y="204" width="396" height="218" rx="14" fill="#18181b" stroke="#0a84ff" stroke-width="1"  filter="url(#sh)"/><text x="536" y="234" font-size="16" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="536" dy="0">ContextCore</tspan></text><text x="536" y="254" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="536" dy="0">your server · plain files · every change