<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.5)"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="410" rx="20" fill="#09090b"/>
<text x="28" y="44" font-size="11" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">WHAT IS INSIDE</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">Not everything weighs the same</tspan></text><rect x="28" y="92" width="560" height="78" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><rect x="44" y="110" width="6" height="42" rx="3" fill="#0a84ff" opacity="1"/><text x="66" y="125" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Your notes</tspan></text><text x="66" y="148" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Your own words and material. Search looks here first.</tspan></text><rect x="479" y="106" width="93" height="26" rx="13" fill="#0b2545" stroke="none"/><text x="525.5" y="123.5" font-size="11.5" font-weight="500" fill="#5eb0ff" text-anchor="middle" letter-spacing="0"><tspan x="525.5" dy="0">weighs most</tspan></text><rect x="28" y="184" width="560" height="78" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><rect x="44" y="202" width="6" height="42" rx="3" fill="#0a84ff" opacity="0.66"/><text x="66" y="217" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Agents’ records</tspan></text><text x="66" y="240" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Each agent’s memory and working logs. Useful, but not your words.</tspan></text><rect x="421" y="198" width="151" height="26" rx="13" fill="#0f0f12" stroke="#27272a"/><text x="496.5" y="215.5" font-size="11.5" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="0"><tspan x="496.5" dy="0">marked as an agent’s</tspan></text><rect x="28" y="276" width="560" height="78" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><rect x="44" y="294" width="6" height="42" rx="3" fill="#0a84ff" opacity="0.5"/><text x="66" y="309" font-size="15.5" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Projects</tspan></text><text x="66" y="332" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">One card per project; its files stay in its own repo.</tspan></text><rect x="370" y="290" width="202" height="26" rx="13" fill="#0f0f12" stroke="#27272a"/><text x="471" y="307.5" font-size="11.5" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="0"><tspan x="471" dy="0">counts only for that project</tspan></text><text x="28" y="386" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">Every search result names its space, so an agent never passes its own guess off as your words.</tspan></text><rect x="612" y="92" width="320" height="262" rx="16" fill="#0f0f12" stroke="#27272a" stroke-width="1"  /><text x="632" y="122" font-size="14" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="632" dy="0">Rules every agent reads at start</tspan></text><circle cx="638" cy="146" r="3" fill="#0a84ff"/><text x="650" y="150" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">About you</tspan></text><text x="650" y="167" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">who you are, timezone, language</tspan></text><circle cx="638" cy="186" r="3" fill="#0a84ff"/><text x="650" y="190" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">Shared rules</tspan></text><text x="650" y="207" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">where things go, when to ask you</tspan></text><circle cx="638" cy="226" r="3" fill="#0a84ff"/><text x="650" y="230" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">Its own rules</tspan></text><text x="650" y="247" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">its job, in its own file</tspan></text><circle cx="638" cy="266" r="3" fill="#0a84ff"/><text x="650" y="270" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">Skills</tspan></text><text x="650" y="287" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">how each kind of work is done</tspan></text><circle cx="638" cy="306" r="3" fill="#0a84ff"/><text x="650" y="310" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">Rights</tspan></text><text x="650" y="327" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="650" dy="0">who may write notes, tasks, rules</tspan></text>
</svg>
