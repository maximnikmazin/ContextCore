<text x="28" y="44" font-size="11" font-weight="600" fill="#0060df" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">ONE MEMORY</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">Say it once. Every agent, in every app, knows it.</tspan></text><rect x="28" y="84" width="290" height="382" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><text x="46" y="114" font-size="14" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="46" dy="0">Monday 09:10</tspan></text><text x="46" y="133" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="46" dy="0">ChatGPT on the phone</tspan></text><rect x="217.51999999999998" y="102" width="82" height="26" rx="13" fill="#eaf3ff" stroke="none"/><text x="258.52" y="119.5" font-size="12" font-weight="500" fill="#0060df" text-anchor="middle" letter-spacing="0"><tspan x="258.52" dy="0">assistant</tspan></text><rect x="78" y="156" width="222" height="55.15" rx="16" fill="#0a84ff" /><text x="92" y="178.175" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="start" letter-spacing="0"><tspan x="92" dy="0">Remember: I moved to</tspan><tspan x="92" dy="19.575">Berlin last week.</tspan></text><text x="46" y="235.15" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="46" dy="0">saves to About you, for every agent</tspan></text><rect x="46" y="247.15" width="254" height="89.80000000000001" rx="10" fill="#eaf3ff" stroke="none"/><text x="58" y="266.15" font-size="10.5" font-weight="600" fill="#0060df" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">ABOUT YOU</tspan></text><text x="58" y="286.15" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#09090b"><tspan x="58" dy="0">- Lives in Berlin</tspan><tspan x="58" dy="18.6">  since 01.11 (owner, 09.11)</tspan><tspan x="58" dy="18.6">- Timezone: Europe/Berlin</tspan></text><rect x="46" y="350.95000000000005" width="222" height="55.15" rx="16" fill="#fafafa" stroke="#e4e4e7"/><text x="60" y="373.12500000000006" font-size="13.5" font-weight="400" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="60" dy="0">Saved: you live in Berlin,</tspan><tspan x="60" dy="19.575">your times are Berlin time.</tspan></text><rect x="334" y="84" width="290" height="382" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><text x="352" y="114" font-size="14" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="352" dy="0">Monday 14:30</tspan></text><text x="352" y="133" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="352" dy="0">Claude on the laptop</tspan></text><rect x="536.96" y="102" width="69" height="26" rx="13" fill="#eaf3ff" stroke="none"/><text x="571.46" y="119.5" font-size="12" font-weight="500" fill="#0060df" text-anchor="middle" letter-spacing="0"><tspan x="571.46" dy="0">planner</tspan></text><rect x="384" y="156" width="222" height="55.15" rx="16" fill="#0a84ff" /><text x="398" y="178.175" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="start" letter-spacing="0"><tspan x="398" dy="0">Add the dentist for</tspan><tspan x="398" dy="19.575">tomorrow at 10.</tspan></text><text x="352" y="235.15" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="352" dy="0">already knows, from start</tspan></text><rect x="352" y="247.15" width="254" height="52.6" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="364" y="266.15" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="364" dy="0">ABOUT YOU</tspan></text><text x="364" y="286.15" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#09090b"><tspan x="364" dy="0">- Timezone: Europe/Berlin</tspan></text><text x="352" y="323.75" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="352" dy="0">saves to your task list</tspan></text><rect x="352" y="335.75" width="254" height="52.6" rx="10" fill="#eaf3ff" stroke="none"/><text x="364" y="354.75" font-size="10.5" font-weight="600" fill="#0060df" text-anchor="start" letter-spacing="0"><tspan x="364" dy="0">TASKS</tspan></text><text x="364" y="374.75" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#09090b"><tspan x="364" dy="0">Dentist · Tue 10.11, 10:00</tspan></text><rect x="352" y="402.35" width="222" height="55.15" rx="16" fill="#fafafa" stroke="#e4e4e7"/><text x="366" y="424.52500000000003" font-size="13.5" font-weight="400" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="366" dy="0">Added for tomorrow,</tspan><tspan x="366" dy="19.575">10:00 Berlin time.</tspan></text><rect x="640" y="84" width="290" height="382" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><text x="658" y="114" font-size="14" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="658" dy="0">Next month</tspan></text><text x="658" y="133" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="658" dy="0">a new agent, a new app</tspan></text><rect x="856.4" y="102" width="56" height="26" rx="13" fill="#eaf3ff" stroke="none"/><text x="884.4" y="119.5" font-size="12" font-weight="500" fill="#0060df" text-anchor="middle" letter-spacing="0"><tspan x="884.4" dy="0">tutor</tspan></text><rect x="690" y="156" width="222" height="35.575" rx="16" fill="#0a84ff" /><text x="704" y="178.175" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="start" letter-spacing="0"><tspan x="704" dy="0">Hi! Let’s start.</tspan></text><text x="658" y="215.575" font-size="12" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="658" dy="0">already knows, from start</tspan></text><rect x="658" y="227.575" width="254" height="89.80000000000001" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="670" y="246.575" font-size="10.5" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="670" dy="0">ABOUT YOU</tspan></text><text x="670" y="266.575" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#09090b"><tspan x="670" dy="0">- Lives in Berlin</tspan><tspan x="670" dy="18.6">- Timezone: Europe/Berlin</tspan><tspan x="670" dy="18.6">- Replies in English</tspan></text><rect x="658" y="331.375" width="240" height="74.725" rx="16" fill="#fafafa" stroke="#e4e4e7"/><text x="672" y="353.55" font-size="13.5" font-weight="400" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="672" dy="0">Hi! Since you live in Berlin,</tspan><tspan x="672" dy="19.575">shall we practise German</tspan><tspan x="672" dy="19.575">for daily life?</tspan></text>
