<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(9,9,11,0.06)"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(9,9,11,0.06)"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#71717a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="380" rx="20" fill="#ffffff"/>
<text x="28" y="44" font-size="11" font-weight="600" fill="#0060df" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">HOW IT WORKS</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">One chat with any agent</tspan></text><rect x="28" y="96" width="210" height="190" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><circle cx="56" cy="126" r="13" fill="#0a84ff"/><text x="56" y="130.5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="56" dy="0">1</tspan></text><text x="78" y="131" font-size="16" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="78" dy="0">You write</tspan></text><text x="48" y="168" font-size="13.5" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">“Remember: the client</tspan><tspan x="48" dy="20.25">call moved to Friday.”</tspan></text><path d="M242 191 L254 191" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="258" y="96" width="210" height="190" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><circle cx="286" cy="126" r="13" fill="#0a84ff"/><text x="286" y="130.5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="286" dy="0">2</tspan></text><text x="308" y="131" font-size="16" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="308" dy="0">start</tspan></text><text x="278" y="168" font-size="13.5" font-weight="400" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="278" dy="0">The agent gets its rules,</tspan><tspan x="278" dy="20.25">your facts, its memory</tspan><tspan x="278" dy="20.25">and the time.</tspan></text><rect x="278" y="242" width="131" height="26" rx="13" fill="#fafafa" stroke="#e4e4e7"/><text x="343.5" y="259.5" font-size="11.5" font-weight="500" fill="#09090b" text-anchor="middle" letter-spacing="0"><tspan x="343.5" dy="0">one call per chat</tspan></text><path d="M472 191 L484 191" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="488" y="96" width="210" height="190" rx="14" fill="#ffffff" stroke="#0a84ff" stroke-width="1"  filter="url(#sh)"/><circle cx="516" cy="126" r="13" fill="#0a84ff"/><text x="516" y="130.5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="516" dy="0">3</tspan></text><text x="538" y="131" font-size="16" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="538" dy="0">run</tspan></text><text x="508" y="168" font-size="13.5" font-weight="400" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="508" dy="0">A short program reads</tspan><tspan x="508" dy="20.25">and saves. The server</tspan><tspan x="508" dy="20.25">checks rights and format.</tspan></text><rect x="508" y="242" width="80" height="26" rx="13" fill="#fafafa" stroke="#e4e4e7"/><text x="548" y="259.5" font-size="11.5" font-weight="500" fill="#09090b" text-anchor="middle" letter-spacing="0"><tspan x="548" dy="0">sandboxed</tspan></text><path d="M702 191 L714 191" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="718" y="96" width="210" height="190" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><circle cx="746" cy="126" r="13" fill="#0a84ff"/><text x="746" y="130.5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="746" dy="0">4</tspan></text><text x="768" y="131" font-size="16" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="768" dy="0">Saved</tspan></text><text x="738" y="168" font-size="13.5" font-weight="400" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="738" dy="0">One git version. Every</tspan><tspan x="738" dy="20.25">other agent sees it on</tspan><tspan x="738" dy="20.25">its next start.</tspan></text><rect x="738" y="242" width="119" height="26" rx="13" fill="#fafafa" stroke="#e4e4e7"/><text x="797.5" y="259.5" font-size="11.5" font-weight="500" fill="#09090b" text-anchor="middle" letter-spacing="0"><tspan x="797.5" dy="0">nothing is lost</tspan></text><rect x="488" y="306" width="440" height="50" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="4 4" /><path d="M603 286 L603 302" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ar)" stroke-linecap="round"/><text x="504" y="336" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="504" dy="0">No right or a bad field → nothing is saved; the agent says why.</tspan></text><text x="28" y="336" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">The agent decides what goes where; the server keeps it safe.</tspan></text>
</svg>
