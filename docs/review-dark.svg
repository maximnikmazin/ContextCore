<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 960 552" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.5)"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="552" rx="20" fill="#09090b"/>
<text x="28" y="44" font-size="11" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">KEEPING IT TIDY</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">Once a day, a review — not a check of every request</tspan></text><rect x="28" y="84" width="330" height="448" rx="16" fill="#0f0f12" stroke="#27272a" stroke-width="1"  /><text x="48" y="114" font-size="14" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">During the day</tspan></text><text x="48" y="134" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Agents save at once, as you talk.</tspan><tspan x="48" dy="18">Nobody re-checks your requests.</tspan></text><rect x="48" y="172" width="290" height="68" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="64" y="198" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">09:10</tspan></text><rect x="108" y="181" width="82" height="26" rx="13" fill="#0b2545" stroke="none"/><text x="149" y="198.5" font-size="12" font-weight="500" fill="#5eb0ff" text-anchor="middle" letter-spacing="0"><tspan x="149" dy="0">assistant</tspan></text><text x="64" y="224" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">About you: lives in Berlin</tspan></text><rect x="48" y="256" width="290" height="68" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="64" y="282" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">14:30</tspan></text><rect x="108" y="265" width="69" height="26" rx="13" fill="#0b2545" stroke="none"/><text x="142.5" y="282.5" font-size="12" font-weight="500" fill="#5eb0ff" text-anchor="middle" letter-spacing="0"><tspan x="142.5" dy="0">planner</tspan></text><text x="64" y="308" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">task: Dentist, Tue 10:00</tspan></text><rect x="48" y="340" width="290" height="68" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="64" y="366" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">18:05</tspan></text><rect x="108" y="349" width="56" height="26" rx="13" fill="#0b2545" stroke="none"/><text x="136" y="366.5" font-size="12" font-weight="500" fill="#5eb0ff" text-anchor="middle" letter-spacing="0"><tspan x="136" dy="0">tutor</tspan></text><text x="64" y="392" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">its memory: “lives in Berlin”</tspan></text><rect x="48" y="424" width="290" height="68" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"  filter="url(#sh)"/><text x="64" y="450" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">19:40</tspan></text><rect x="108" y="433" width="56" height="26" rx="13" fill="#0b2545" stroke="none"/><text x="136" y="450.5" font-size="12" font-weight="500" fill="#5eb0ff" text-anchor="middle" letter-spacing="0"><tspan x="136" dy="0">tutor</tspan></text><text x="64" y="476" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">its memory: “always reply in English”</tspan></text><line x1="384" y1="96" x2="384" y2="520" stroke="#27272a" stroke-dasharray="3 5"/><rect x="352" y="290" width="64" height="26" rx="13" fill="#0a84ff" stroke="none"/><text x="384" y="307.5" font-size="12.5" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="0"><tspan x="384" dy="0">21:00</tspan></text><text x="412" y="114" font-size="14" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="412" dy="0">At 21:00 your system agent runs its review</tspan></text><text x="412" y="134" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="412" dy="0">It reads only what changed today and sends you one message:</tspan></text><rect x="412" y="152" width="520" height="147.95" rx="16" fill="#0f0f12" stroke="#27272a"/><text x="426" y="173.65" font-size="13" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="426" dy="0">Today’s review, 3 changes:</tspan><tspan x="426" dy="18.849999999999998">1. “Lives in Berlin” is in tutor’s memory and already in</tspan><tspan x="426" dy="18.849999999999998">    About you → remove it from tutor.</tspan><tspan x="426" dy="18.849999999999998">2. “Always reply in English” is a rule, not a fact →</tspan><tspan x="426" dy="18.849999999999998">    move it to tutor’s rules.</tspan><tspan x="426" dy="18.849999999999998">3. “Gym on Mondays, until 31.10” has expired → remove.</tspan><tspan x="426" dy="18.849999999999998">Apply all three?</tspan></text><rect x="852" y="311.95" width="80" height="35.575" rx="16" fill="#0a84ff" /><text x="866" y="334.125" font-size="13.5" font-weight="400" fill="#ffffff" text-anchor="start" letter-spacing="0"><tspan x="866" dy="0">Yes</tspan></text><rect x="412" y="359.525" width="360" height="34.849999999999994" rx="16" fill="#0f0f12" stroke="#27272a"/><text x="426" y="381.17499999999995" font-size="13" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="426" dy="0">Done. The old lines stay in history.</tspan></text><rect x="412" y="452" width="520" height="80" rx="14" fill="#0f0f12" stroke="#27272a" stroke-width="1"  /><text x="432" y="478" font-size="13" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="432" dy="0">Weekly, the same way</tspan></text><text x="432" y="500" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="432" dy="0">Saturday: agents’ files and project cards. Sunday: your notes —</tspan><tspan x="432" dy="18">links, hub pages for big topics, duplicates. Always a list, then your yes.</tspan></text>
</svg>
