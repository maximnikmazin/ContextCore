<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(9,9,11,0.06)"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(9,9,11,0.06)"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#71717a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="330" rx="20" fill="#ffffff"/>
<text x="28" y="44" font-size="11" font-weight="600" fill="#0060df" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">IT STAYS TIDY</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">Agents save freely. You decide what changes.</tspan></text><rect x="28" y="92" width="210" height="150" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><text x="48" y="126" font-size="15.5" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Agents save</tspan></text><text x="48" y="156" font-size="13" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Facts, rules, notes and logs,</tspan><tspan x="48" dy="19.5">as they work. No limits.</tspan></text><path d="M242 167 L254 167" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="258" y="92" width="210" height="150" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><text x="278" y="126" font-size="15.5" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="278" dy="0">Review agent reads</tspan></text><text x="278" y="156" font-size="13" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="278" dy="0">What changed since last time:</tspan><tspan x="278" dy="19.5">daily memory, weekly files</tspan><tspan x="278" dy="19.5">and notes.</tspan></text><path d="M472 167 L484 167" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="488" y="92" width="210" height="150" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"  filter="url(#sh)"/><text x="508" y="126" font-size="15.5" font-weight="650" fill="#09090b" text-anchor="start" letter-spacing="0"><tspan x="508" dy="0">One short list</tspan></text><text x="508" y="156" font-size="13" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="508" dy="0">Duplicates, outdated facts,</tspan><tspan x="508" dy="19.5">missing links, hub notes,</tspan><tspan x="508" dy="19.5">new note types.</tspan></text><path d="M702 167 L714 167" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><rect x="718" y="92" width="210" height="150" rx="14" fill="#ffffff" stroke="#0a84ff" stroke-width="1"  filter="url(#sh)"/><text x="738" y="126" font-size="15.5" font-weight="650" fill="#0060df" text-anchor="start" letter-spacing="0"><tspan x="738" dy="0">You say yes</tspan></text><text x="738" y="156" font-size="13" font-weight="400" fill="#71717a" text-anchor="start" letter-spacing="0"><tspan x="738" dy="0">Only then it changes.</tspan><tspan x="738" dy="19.5">History is never removed.</tspan></text><path d="M813 246 C 813 296, 133 296, 133 250" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)" stroke-linecap="round"/><text style="paint-order:stroke" stroke="#ffffff" stroke-width="6" x="473" y="288" font-size="11.5" font-weight="500" fill="#71717a" text-anchor="middle" letter-spacing="0"><tspan x="473" dy="0">the next round starts from here</tspan></text>
</svg>
