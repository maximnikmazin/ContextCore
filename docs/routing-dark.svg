<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.5)"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="410" rx="20" fill="#09090b"/>
<text x="28" y="44" font-size="11" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">WHERE THINGS GO</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">One message, three places, one question</tspan></text><rect x="28" y="92" width="330" height="97.2" rx="16" fill="#0a84ff" /><text x="42" y="114.7" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" letter-spacing="0"><tspan x="42" dy="0">Add a task: send the invoice to Anna</tspan><tspan x="42" dy="20.3">by Friday. By the way, Anna prefers</tspan><tspan x="42" dy="20.3">WhatsApp. And from now on, always</tspan><tspan x="42" dy="20.3">put money tasks first.</tspan></text><text x="28" y="213.2" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">The agent splits the message by meaning,</tspan><tspan x="28" dy="18">then asks the shared rules where each part goes.</tspan></text><path d="M362 150 C 410 150, 420 130, 464 130" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><text x="470" y="98" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="470" dy="0">Work you will do</tspan></text><rect x="879" y="84" width="53" height="26" rx="13" fill="#0f2e1f" stroke="none"/><text x="905.5" y="101.5" font-size="11" font-weight="500" fill="#3dd68c" text-anchor="middle" letter-spacing="0"><tspan x="905.5" dy="0">saved</tspan></text><rect x="470" y="110" width="462" height="52.6" rx="10" fill="#0b2545" stroke="none"/><text x="482" y="129" font-size="10.5" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="482" dy="0">TASKS</tspan></text><text x="482" y="149" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#fafafa"><tspan x="482" dy="0">Send invoice to Anna · by Fri 13.11</tspan></text><path d="M362 150 C 410 150, 420 234, 464 234" fill="none" stroke="#0a84ff" stroke-width="1.5"  marker-end="url(#arA)" stroke-linecap="round"/><text x="470" y="202" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="470" dy="0">A fact you may need again</tspan></text><rect x="879" y="188" width="53" height="26" rx="13" fill="#0f2e1f" stroke="none"/><text x="905.5" y="205.5" font-size="11" font-weight="500" fill="#3dd68c" text-anchor="middle" letter-spacing="0"><tspan x="905.5" dy="0">saved</tspan></text><rect x="470" y="214" width="462" height="52.6" rx="10" fill="#0b2545" stroke="none"/><text x="482" y="233" font-size="10.5" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="482" dy="0">YOUR NOTES · person: Anna</tspan></text><text x="482" y="253" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#fafafa"><tspan x="482" dy="0">- Prefers WhatsApp (owner, 10.11)</tspan></text><path d="M362 150 C 410 150, 420 338, 464 338" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ar)" stroke-linecap="round"/><text x="470" y="306" font-size="13" font-weight="600" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="470" dy="0">A rule for how tasks work</tspan></text><rect x="799" y="292" width="133" height="26" rx="13" fill="#0f0f12" stroke="#27272a"/><text x="865.5" y="309.5" font-size="11" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="0"><tspan x="865.5" dy="0">waits for your yes</tspan></text><rect x="470" y="318" width="462" height="52.6" rx="10" fill="#0f0f12" stroke="#27272a"/><text x="482" y="337" font-size="10.5" font-weight="600" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="482" dy="0">TASK RULES · for every agent</tspan></text><text x="482" y="357" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#fafafa"><tspan x="482" dy="0">+ Money tasks go first.</tspan></text><rect x="470" y="400" width="462" height="53.699999999999996" rx="16" fill="#0f0f12" stroke="#27272a"/><text x="484" y="421.65" font-size="13" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="484" dy="0">Added the task for Friday and saved that Anna prefers</tspan><tspan x="484" dy="18.849999999999998">WhatsApp. Shall I add to the task rules: “money tasks first”?</tspan></text>
</svg>
