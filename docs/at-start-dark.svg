<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.5)"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.5)"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0a84ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="560" rx="20" fill="#09090b"/>
<text x="28" y="44" font-size="11" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="28" dy="0">AT THE START OF EVERY CHAT</tspan></text><text x="28" y="70" font-size="21" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="-0.3"><tspan x="28" dy="0">The agent calls start and reads this before it answers</tspan></text><rect x="28" y="84" width="640" height="72.75" rx="10" fill="#0f0f12" stroke="#27272a"/><text x="40" y="103" font-size="10.5" font-weight="600" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">ITS JOB AND RULES</tspan></text><text x="40" y="123.625" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa"><tspan x="40" dy="0">Keeps the owner’s to-do list and the morning brief.</tspan><tspan x="40" dy="19.375">- Short lists, the top 3 first (owner, 03.11)</tspan></text><text x="656" y="103" font-size="11" font-weight="400" fill="#a1a1aa" text-anchor="end" letter-spacing="0"><tspan x="656" dy="0">its own file</tspan></text><rect x="28" y="166.75" width="640" height="72.75" rx="10" fill="#0b2545" stroke="none"/><text x="40" y="185.75" font-size="10.5" font-weight="600" fill="#5eb0ff" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">ABOUT YOU</tspan></text><text x="40" y="206.375" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa"><tspan x="40" dy="0">- Lives in Berlin since 01.11 (owner, 09.11)</tspan><tspan x="40" dy="19.375">- Timezone: Europe/Berlin</tspan></text><text x="656" y="185.75" font-size="11" font-weight="400" fill="#a1a1aa" text-anchor="end" letter-spacing="0"><tspan x="656" dy="0">shared by all agents</tspan></text><rect x="28" y="249.5" width="640" height="72.75" rx="10" fill="#0f0f12" stroke="#27272a"/><text x="40" y="268.5" font-size="10.5" font-weight="600" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">SHARED RULES</tspan></text><text x="40" y="289.125" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa"><tspan x="40" dy="0">Where things go: 1. a place you named → there.</tspan><tspan x="40" dy="19.375">2. a rule → the skill for that work. 3. work → tasks …</tspan></text><text x="656" y="268.5" font-size="11" font-weight="400" fill="#a1a1aa" text-anchor="end" letter-spacing="0"><tspan x="656" dy="0">shared by all agents</tspan></text><rect x="28" y="332.25" width="640" height="53.375" rx="10" fill="#0f0f12" stroke="#27272a"/><text x="40" y="351.25" font-size="10.5" font-weight="600" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">ITS RIGHTS</tspan></text><text x="40" y="371.875" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa"><tspan x="40" dy="0">tasks: yes · notes: yes · shared rules: no (only assistant)</tspan></text><text x="656" y="351.25" font-size="11" font-weight="400" fill="#a1a1aa" text-anchor="end" letter-spacing="0"><tspan x="656" dy="0">from the rights file</tspan></text><rect x="28" y="395.625" width="640" height="53.375" rx="10" fill="#0f0f12" stroke="#27272a"/><text x="40" y="414.625" font-size="10.5" font-weight="600" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">ITS MEMORY</tspan></text><text x="40" y="435.25" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa"><tspan x="40" dy="0">- Dentist is Dr. Weber, Praxis am Park (owner, 05.11)</tspan></text><text x="656" y="414.625" font-size="11" font-weight="400" fill="#a1a1aa" text-anchor="end" letter-spacing="0"><tspan x="656" dy="0">only this agent</tspan></text><rect x="28" y="459" width="640" height="72.75" rx="10" fill="#0f0f12" stroke="#27272a"/><text x="40" y="478" font-size="10.5" font-weight="600" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">YOUR PROJECTS · NOW</tspan></text><text x="40" y="498.625" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#fafafa"><tspan x="40" dy="0">website: personal site and blog · active</tspan><tspan x="40" dy="19.375">Tue 10.11, 14:30 (Europe/Berlin)</tspan></text><text x="656" y="478" font-size="11" font-weight="400" fill="#a1a1aa" text-anchor="end" letter-spacing="0"><tspan x="656" dy="0">one line each</tspan></text><rect x="692" y="84" width="240" height="290" rx="16" fill="#0f0f12" stroke="#27272a" stroke-width="1"  /><text x="712" y="114" font-size="14" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="712" dy="0">Why this matters</tspan></text><text x="712" y="142" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="712" dy="0">The app’s own memory is</tspan><tspan x="712" dy="19.5">not needed. Open the agent</tspan><tspan x="712" dy="19.5">in any app: it has the same</tspan><tspan x="712" dy="19.5">job, facts and rules.</tspan><tspan x="712" dy="19.5"> </tspan><tspan x="712" dy="19.5">Each agent gets only the</tspan><tspan x="712" dy="19.5">rules of its own job and</tspan><tspan x="712" dy="19.5">rights. A planner never</tspan><tspan x="712" dy="19.5">reads how to edit notes.</tspan></text><rect x="692" y="390" width="240" height="106" rx="16" fill="#0f0f12" stroke="#27272a" stroke-width="1"  /><text x="712" y="418" font-size="14" font-weight="650" fill="#fafafa" text-anchor="start" letter-spacing="0"><tspan x="712" dy="0">Then, as it works</tspan></text><text x="712" y="442" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0"><tspan x="712" dy="0">It searches your notes, tasks</tspan><tspan x="712" dy="19.5">and projects when it needs</tspan><tspan x="712" dy="19.5">more, and saves at once.</tspan></text>
</svg>
