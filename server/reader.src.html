<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ContextCore">
<link rel="manifest" href="/v/manifest.webmanifest"><link rel="icon" href="/v/icon.svg"><link rel="apple-touch-icon" href="/v/icon.svg">
<title>ContextCore</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--fg:#111114;--muted:#6b6b73;--line:#e6e6ea;--chip:#efeff2;--accent:#3b6cf6;--hi:#d9480f;--fs:17px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#151517;--fg:#ededf0;--muted:#9a9aa3;--line:#26262a;--chip:#222226;--accent:#7aa2ff;--hi:#ff8a4c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;min-height:44px}
.hrow h1{font-size:1.25em;line-height:1.2;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;margin-left:-12px;border:0;background:none;color:var(--accent);font-size:1em;cursor:pointer}
.status{font-size:.72em;color:var(--muted);white-space:nowrap}
.search{width:100%;height:42px;margin:6px 0 2px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:max(16px,.95em);outline:none}
.search:focus{border-color:var(--accent)}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font-size:.72em;color:var(--muted);gap:2px}
nav.tabs a.on{color:var(--accent);font-weight:600}
nav.tabs svg{width:24px;height:24px}
.group{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;font-size:.78em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.group .n{font-weight:500}
.list{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.row{display:block;padding:12px 16px;min-height:48px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--chip)}
.row .t{font-weight:500}
.row .p{color:var(--muted);font-size:.86em;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{color:var(--muted);font-size:.78em;margin-top:3px}
.sub{margin:4px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.88em}
.sub li{padding:2px 0 2px 14px;position:relative}.sub li:before{content:"–";position:absolute;left:0}
.lvl{padding:8px 16px 4px;font-size:.72em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);background:color-mix(in srgb,var(--chip) 50%,transparent)}
.lvl:first-child{border-top:0}.lvl.high{color:var(--hi)}
.chip{display:inline-block;font-size:.74em;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:4px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 20px;overflow-wrap:anywhere}
.doc .cap{color:var(--muted);font-size:.8em;margin-bottom:10px}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.3em 0 .4em;padding:0;border:0}
.md h1{font-size:1.3em}.md h2{font-size:1.12em}.md h3,.md h4{font-size:1em}
.md p{margin:.55em 0}.md ul,.md ol{margin:.4em 0;padding-left:1.3em}.md li{margin:.2em 0}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.md code{font:.88em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);padding:1px 5px;border-radius:5px}
.md pre{background:var(--chip);padding:12px;border-radius:10px;overflow:auto;font-size:.85em}.md pre code{background:none;padding:0}
.md blockquote{margin:.6em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow:auto;font-size:.88em}.md td,.md th{border:1px solid var(--line);padding:4px 8px}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
details.orig{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.orig summary{color:var(--accent);cursor:pointer;min-height:32px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
.btn{display:block;width:100%;min-height:48px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1em;cursor:pointer}
.sizes{display:flex;gap:8px}.sizes .btn{flex:1}
.meta{color:var(--muted);font-size:.8em;margin:10px 2px}
.hide{display:none!important}
.chev{position:relative;padding-right:34px}.chev:after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.3em}
.m.over{color:var(--hi);font-weight:600}
.sec{margin:6px 0 30px}
.sech{margin:8px 2px 10px}.sech .kind{font-size:.72em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sech .name{font-size:1.3em;font-weight:700;line-height:1.25}.sech .name a{color:var(--fg)}.sech .cnt{font-size:.8em;color:var(--muted)}
.lvlh{margin:14px 2px 6px;font-size:.92em;font-weight:700}.lvlh.high{color:var(--hi)}
.lvlh:first-of-type{margin-top:4px}
.dh{margin:0 0 6px;font-size:1.25em;line-height:1.3}.full{margin:0 0 10px;color:var(--muted)}
.kv{display:flex;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:.92em}.kv span:first-child{min-width:84px;color:var(--muted)}.kv a{color:var(--accent)}
.sep{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
details.fold summary{list-style:none;cursor:pointer}details.fold summary::-webkit-details-marker{display:none}details.fold summary:before{content:"▸ ";}details.fold[open] summary:before{content:"▾ "}
nav.tabs a{font-size:.66em}
#bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .25s ease,opacity .4s ease;opacity:0}
#bar.on{opacity:1}
#bar.wait{width:35%!important;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-4px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{color:var(--muted);padding:6px 0}
</style></head><body>
<header><div class="hrow"><button class="icon hide" id="back" aria-label="Back">‹ Back</button><h1 id="title">ContextCore</h1><span class="status" id="status"></span></div><div id="hx"></div><div id="bar"></div></header>
<main id="out"><p class="empty"><span class="spin"></span>Loading…</p></main>
<nav class="tabs" id="tabs">
<a href="#tasks" data-t="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>Tasks</a>
<a href="#notes" data-t="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Notes</a>
<a href="#projects" data-t="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects</a>
<a href="#agents" data-t="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>Agents</a>
<a href="#system" data-t="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>System</a>
</nav>
<script>/*MARKED*/</script>
<script>
'use strict';
try{history.scrollRestoration='manual'}catch{}
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let D=null, byPath={}, scrolls={}, queries={}, lastRoute='', syncing=false, lastSync=0, syncNote='';
const SYS={'user.md':'About you — every agent reads it in every chat','agents.md':'Shared rules for all agents','access.yaml':'Rights: who may change your notes and tasks','system/dictionaries/note-types.md':'Kinds of notes','system/dictionaries/note-types-suggestions.md':'Suggested new kinds of notes','system/dictionaries/task-priority.md':'Task priorities','system/dictionaries/task-statuses.md':'Task statuses'};
const VEC={endeavor:'Work and projects',maintenance:'Maintenance',wellbeing:'Wellbeing',growth:'Growth',joy:'Joy'};

// safe markdown: raw HTML is shown as text, only http(s)/mailto/# links, no remote images
const md=(()=>{
  if(!window.marked)return t=>`<pre>${esc(t)}</pre>`;
  const r=new marked.Renderer();
  r.html=h=>esc(typeof h==='object'?h.text:h);
  r.link=(href,title,text)=>{if(typeof href==='object'){({href,title,text}=href)}const ok=/^(https?:|mailto:|#)/i.test(href||'');if(!ok)return text;const ext=!href.startsWith('#');return `<a href="${esc(href)}"${ext?' target="_blank" rel="noopener noreferrer"':''}>${text}</a>`};
  r.image=(href,title,text)=>{if(typeof href==='object'){({href,text}=href)}return /^https?:/i.test(href||'')?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text||'image')}</a>`:esc(text||'')};
  marked.setOptions({renderer:r,gfm:true,breaks:true});
  return t=>marked.parse(String(t||''));
})();
const wiki=t=>String(t||'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,x,label)=>{const k=x.trim();const card=byPath[`projects/${k}/card.md`];const f=card||D.files.find(g=>g.path.endsWith('/'+k+'.md'));return f?`[${label||k}](#${card?'project':'f'}/${encodeURIComponent(f.path)})`:(label||k)});
const stripFront=t=>String(t||'').replace(/^---[\s\S]*?---\s*/,'');
const heading=f=>(stripFront(f.text).match(/^#\s+(.+)/m)||[])[1];
const title=f=>f.meta.title||heading(f)||f.path.split('/').pop().replace(/\.(md|yaml)$/,'').replace(/^\d{6}-/,'').replace(/-/g,' ');
const pDate=f=>{const m=f.path.match(/^brain\/(\d\d)(\d\d)(\d\d)-/);return m?`20${m[1]}-${m[2]}-${m[3]}`:''};   // the move of 06.11 set created on every note, so only the name's date means something
const dshow=iso=>{if(!iso)return '';const [y,m,d]=String(iso).slice(0,10).split('-');if(!d)return '';const now=new Date().getFullYear();return `${d}.${m}${+y!==now?'.'+y.slice(2):''}`};
const preview=f=>f.preview!=null&&!f.text?f.preview:stripFront(f.text).replace(/^#.*\n/,'').replace(/[#*_>`\[\]]/g,'').trim().slice(0,160);
const card=f=>Object.fromEntries(String(f.text).split('\n').map(l=>l.match(/^(\w+):\s?(.*)$/)).filter(Boolean).map(m=>[m[1],m[2]]));
function setData(x){D=x;byPath=Object.fromEntries(D.files.map(f=>[f.path,f]));D.notes=D.files.filter(f=>f.path.startsWith('brain/')).sort((a,b)=>(pDate(b)||'').localeCompare(pDate(a)||'')||title(a).localeCompare(title(b)));}

// ---------- local copy (IndexedDB) ----------
const idb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('cc-reader',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
async function idbGet(k){try{const db=await idb();return await new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch{return null}}
async function idbSet(k,v){try{const db=await idb();await new Promise(ok=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=ok;tx.onerror=ok})}catch{}}
async function idbClear(){try{const db=await idb();await new Promise(ok=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=ok;tx.onerror=ok})}catch{}}

// ---------- sync ----------
// the progress bar: a share when the size is known, a moving stripe when not
let prog=null;
function bar(v){const b=$('bar');if(v==null){b.className='';b.style.width='0';return}b.className='on'+(v<0?' wait':'');if(v>=0)b.style.width=Math.max(4,Math.round(v*100))+'%'}
function showStatus(){const el=$('status');if(!D){el.textContent='';return}
  el.textContent=prog?prog:syncNote||'';}
async function getJSON(url,label,headers){
  const r=await fetch(url,{cache:'no-store',credentials:'same-origin',headers:headers||{}});
  if(r.status===401)throw Object.assign(new Error('401'),{code:401});
  if(r.status===304)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  const total=+r.headers.get('X-Raw-Length')||0;
  if(!r.body||!total){bar(-1);return r.json()}
  const rd=r.body.getReader();const parts=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;const k=got/total;bar(k);if(label){prog=`${label} ${Math.min(99,Math.round(k*100))}%`;showStatus()}}
  const buf=new Uint8Array(got);let o=0;for(const p of parts){buf.set(p,o);o+=p.length}
  return JSON.parse(new TextDecoder().decode(buf));
}
async function sync(force){
  if(syncing||(!force&&Date.now()-lastSync<20000))return;syncing=true;
  try{
    if(!D){bar(-1);prog='Loading…';showStatus();const x=await getJSON('/v/api/first','Loading');setData(x);render(true)}
    else{bar(-1)}
    const hadLite=D.lite;
    if(D.lite){prog='Downloading notes 0%';showStatus()}
    const x=await getJSON('/v/api/snapshot',D.lite?'Downloading notes':'',D.lite?{}:{'If-None-Match':`"${D.version}"`});
    if(x){const keep=D.lite?{}:Object.fromEntries(D.files.filter(f=>f.meta.original).map(f=>[f.path,f.meta.original]));
      x.noOrig=true;x.files.forEach(f=>{if(keep[f.path]&&f.hasOriginal)f.meta.original=keep[f.path]});
      setData(x);render(true);await idbSet('snap',x)}
    if(D.noOrig){prog=hadLite?'Downloading originals':'';showStatus();const o=await getJSON('/v/api/originals',hadLite?'Downloading originals':'');
      if(o&&o.version===D.version){D.files.forEach(f=>{if(o.originals[f.path])f.meta.original=o.originals[f.path]});D.noOrig=false;await idbSet('snap',D);if(cur().view==='f')render(true)}}
    lastSync=Date.now();syncNote='';
  }catch(e){if(e.code===401){syncNote=D?'Link expired':'';locked()}else{syncNote=D?'Offline · saved copy':'';if(!D)$('out').innerHTML='<p class="empty">No connection, and nothing saved on this phone yet.</p>'}}
  finally{syncing=false;prog=null;bar(null);showStatus()}
}
function locked(){if(!D)$('out').innerHTML='<p class="empty">This page needs your private ContextCore link.<br>Open that link once on this phone (the one that ends with /r/…); after that this address works by itself.</p>'}
// a file opened before the full copy is here: fetch just that file
const loadingFiles=new Set();const early={};   // a file asked for before the list arrived
async function loadFile(p){if(loadingFiles.has(p))return;loadingFiles.add(p);
  try{const x=await (early[p]||getJSON('/v/api/file?p='+encodeURIComponent(p)));delete early[p];const f=byPath[p];if(x&&f){f.text=x.text;f.meta=x.meta;if(x.original)f.meta.original=x.original;f.loaded=true}}catch(e){}
  loadingFiles.delete(p);bar(syncing?-1:null);if(['f','agent'].includes(cur().view))render(true)}

// ---------- views ----------
const row=(href,t,p,m)=>`<a class="row chev" href="${href}"><div class="t">${t}</div>${p?`<div class="p">${p}</div>`:''}${m?`<div class="m">${m}</div>`:''}</a>`;
const tname=t=>t.short||t.title;   // a short name when the server has one (being decided, 07.11), else the title
const PRI={high:'High priority',medium:'Medium priority',low:'Low priority'};
const today=()=>new Date().toISOString().slice(0,10);
function taskMeta(t){const n=(t.children||[]).length;const due=t.deadline||t.day;
  return [n?`${n} subtask${n>1?'s':''}`:'',due?(due<today()?`Overdue · ${dshow(due)}`:`${t.deadline?'Due':'Day'} ${dshow(due)}`):'',t.status&&t.status!=='planned'?t.status:''].filter(Boolean).join(' · ')}
function taskRow(t){const m=taskMeta(t);const over=/Overdue/.test(m);
  return `<a class="row chev" href="#task/${t.id}" data-q="${esc((tname(t)+' '+t.title+' '+(t.children||[]).map(c=>c.title).join(' ')).toLowerCase())}"><div class="t">${esc(tname(t))}</div>${m?`<div class="m${over?' over':''}">${esc(m)}</div>`:''}</a>`}
function allTasks(){const out=[];const walk=(t,parent)=>{out.push({...t,parentId:parent});(t.children||[]).forEach(c=>walk(c,t.id))};D.sections.forEach(s=>(s.levels?s.levels.flatMap(l=>l.tasks):s.tasks||[]).forEach(t=>walk(t,null)));return out}
const projCard=id=>byPath[`projects/${id}/card.md`];
const openTop=id=>allTasks().filter(t=>t.project===id&&t.parentId==null);
// memory lines "- text (source, DD.MM)" → newest first; lines without a date apart
function memLines(text){const lines=stripFront(text).split('\n').filter(l=>/^\s*[-*]\s+/.test(l)).map(l=>l.replace(/^\s*[-*]\s+/,''));
  const yr=new Date().getFullYear(),mo=new Date().getMonth()+1;
  return lines.map(l=>{const ds=[...l.matchAll(/(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?![\d.])/g)];const d=ds.length?ds[ds.length-1]:null;
    let iso='';if(d){const m=+d[2],y=d[3]?(+d[3]<100?2000+ +d[3]:+d[3]):(m>mo?yr-1:yr);if(m>=1&&m<=12&&+d[1]>=1&&+d[1]<=31)iso=`${y}-${String(m).padStart(2,'0')}-${String(+d[1]).padStart(2,'0')}`}
    return {text:l,iso}})}
const SECTION_HEAD=s=>{const c=projCard(s.section);const name=s.heading||(c&&card(c).name)||VEC[s.section]||s.section;
  return `<div class="sech"><div class="kind">${c?'Project':'Life area'}</div><div class="name">${c?`<a href="#project/${encodeURIComponent(c.path)}">${esc(name)} ›</a>`:esc(name)}</div><div class="cnt">${s.count} open</div></div>`};
const V={
  tasks(){
    if(!D.sections.length)return '<p class="empty">No open tasks.</p>';
    return D.sections.map(s=>`<section class="sec">${SECTION_HEAD(s)}${s.levels?s.levels.filter(l=>l.tasks.length).map(l=>`<div class="lvlh ${l.priority}">${esc(PRI[l.priority]||l.priority)} · ${l.tasks.length}</div><div class="list">${l.tasks.map(taskRow).join('')}</div>`).join(''):`<div class="list">${(s.tasks||[]).map(taskRow).join('')}</div>`}</section>`).join('');
  },
  notes(){return `<div id="nl"></div>`},
  projects(){
    const cs=D.files.filter(f=>f.path.endsWith('/card.md')).map(f=>({f,c:card(f),id:f.path.split('/')[1]}));
    const g={};cs.forEach(x=>{const s=x.c.status||'active';(g[s]=g[s]||[]).push(x)});
    const LBL={active:'Active',paused:'Paused',done:'Done',archive:'Archive'};
    const block=k=>{const items=g[k].sort((a,b)=>String(a.c.name).localeCompare(String(b.c.name))).map(({f,c,id})=>{const n=openTop(id).length;return row(`#project/${encodeURIComponent(f.path)}`,esc(c.name||id),esc(c.what||''),n?`${n} open task${n>1?'s':''}`:'')}).join('');
      return k==='active'||k==='paused'?`<div class="group">${LBL[k]} <span class="n">${g[k].length}</span></div><div class="list">${items}</div>`:`<details class="fold"><summary class="group">${LBL[k]||esc(k)} <span class="n">${g[k].length}</span></summary><div class="list">${items}</div></details>`};
    return ['active','paused','done','archive',...Object.keys(g).filter(k=>!LBL[k])].filter(k=>g[k]).map(block).join('');
  },
  agents(){
    const as=D.files.filter(f=>f.path.startsWith('agents/'));const names=[...new Set(as.map(f=>f.path.split('/')[1]))].sort();
    if(!names.length)return '<p class="empty">No agents yet.</p>';
    return `<div class="list">${names.map(n=>{const a=byPath[`agents/${n}/agent.md`],m=byPath[`agents/${n}/memory.md`];const data=as.filter(f=>f.path.startsWith(`agents/${n}/data/`)).length;
      const role=a?stripFront(a.text).replace(/^#.*\n/,'').trim().split(/\n\s*\n|\n-/)[0].replace(/[#*_`]/g,'').trim():'';
      const mem=m?memLines(m.text).length:0;
      return row(`#agent/${encodeURIComponent(n)}`,esc(n[0].toUpperCase()+n.slice(1)),esc(role),[mem?`${mem} memory entries`:'',data?`${data} attachment${data>1?'s':''}`:''].filter(Boolean).join(' · '))}).join('')}</div>`;
  },
  system(){
    const sk=D.files.filter(f=>/^skills\/[^/]+\/SKILL\.md$/.test(f.path));
    const doc=(k,lbl,sub)=>byPath[k]?row(`#f/${encodeURIComponent(k)}`,esc(lbl),esc(sub||''),''):'';
    return `<div class="list">${doc('user.md','About you','What every agent knows about you in every chat')}${doc('agents.md','Shared rules','Rules every agent follows')}${doc('access.yaml','Agent rights','Who may change your notes, tasks and the system')}</div>
    <div class="group">Skills <span class="n">${sk.length}</span></div><div class="list" id="sl">${sk.map(f=>`<a class="row chev" href="#f/${encodeURIComponent(f.path)}" data-q="${esc((f.path+' '+(f.meta.description||'')).toLowerCase())}"><div class="t">${esc(f.path.split('/')[1])}</div><div class="p">${esc(String(f.meta.description||f.meta.when||preview(f)))}</div></a>`).join('')}</div>
    <div class="group">Tasks</div><div class="list">${doc('system/dictionaries/task-priority.md','Task priorities','')}${doc('system/dictionaries/task-statuses.md','Task statuses','')}</div>
    <div class="group">This phone</div>
    <div class="sizes"><button class="btn" onclick="size(-1)">A−</button><button class="btn" onclick="size(0)">Text size</button><button class="btn" onclick="size(1)">A+</button></div>
    <button class="btn" onclick="sync(true)">Update now</button><button class="btn" onclick="wipe()">Delete the downloaded copy</button>
    <p class="meta">Removes this phone's saved copy; the server keeps everything. The page keeps a copy so it opens at once, also offline. Read only.${D.lite?' Still downloading the full copy…':''}</p>`;
  },
};
const TITLES={tasks:'Tasks',notes:'Notes',projects:'Projects',agents:'Agents',system:'System'};
const TABS=['tasks','notes','projects','agents','system'];
const SEARCH={tasks:'Search tasks',notes:'Search notes'};

function docView(f,cap){
  if(!f)return '<p class="empty">Not found. It may have been moved.</p>';
  const head=heading(f);let body=stripFront(f.text);
  if(head)body=body.replace(/^#\s+.+\n?/m,'');
  const full=!D.lite||f.text||f.loaded;
  if(!full)loadFile(f.path);
  const origHere=!!f.meta.original;
  const metaBits=[f.meta.stage==='raw'?'not sorted yet':'',dshow(pDate(f)),f.meta.by&&!/^migrat/.test(f.meta.by)?'by '+f.meta.by:''].filter(Boolean);
  return `<div class="doc">${cap?`<div class="cap">${esc(cap)}</div>`:''}${metaBits.length?`<div class="cap">${esc(metaBits.join(' · '))}</div>`:''}
  <div class="md">${full?(f.path.endsWith('.md')?md(wiki(body)):`<pre>${esc(body)}</pre>`):`<p class="loading"><span class="spin"></span>Loading this note…</p><p style="color:var(--muted)">${esc(f.preview||'')}</p>`}</div>
  ${origHere?`<details class="orig"><summary>Original text</summary><div class="md">${md(wiki(stripFront(f.meta.original)))}</div></details>`:f.hasOriginal?`<details class="orig" ontoggle="if(this.open)loadFile('${esc(f.path).replace(/'/g,"\\'")}')"><summary>Original text</summary><p class="loading"><span class="spin"></span>Loading…</p></details>`:''}
  </div><p class="meta">${esc(f.path)}</p>`;
}
const lab=(k,v)=>v?`<div class="kv"><span>${k}</span><span>${v}</span></div>`:'';
function taskView(id){
  const all=allTasks();const t=all.find(x=>String(x.id)===String(id));if(!t)return '<p class="empty">This task is no longer open.</p>';
  const x=D.tasks[t.id]||{};const par=t.parentId!=null?all.find(y=>y.id===t.parentId):null;
  const pc=t.project&&projCard(t.project);
  const due=t.deadline?(t.deadline<today()?`<b class="over">Overdue · ${dshow(t.deadline)}</b>`:dshow(t.deadline)):'';
  return `<div class="doc"><h2 class="dh">${esc(tname(t))}</h2>${t.short&&t.short!==t.title?`<p class="full">${esc(t.title)}</p>`:''}
  ${lab('Project',pc?`<a href="#project/${encodeURIComponent(pc.path)}">${esc(card(pc).name||t.project)}</a>`:'')}${!pc&&t.vector?lab('Life area',esc(VEC[t.vector]||t.vector)):''}
  ${par?lab('Part of',`<a href="#task/${par.id}">${esc(tname(par))}</a>`):''}${lab('Priority',esc(t.priority||''))}${lab('Status',esc(t.status||''))}${lab('Deadline',due)}${lab('Day',t.day?dshow(t.day):'')}${lab('Added',x.created?dshow(x.created):'')}
  ${t.description?`<div class="md sep">${md(t.description)}</div>`:''}${x.comment?`<div class="md sep">${md(x.comment)}</div>`:''}</div>
  ${t.children&&t.children.length?`<div class="group">Subtasks <span class="n">${t.children.length}</span></div><div class="list">${t.children.map(taskRow).join('')}</div>`:''}`;
}
function projectView(p){const f=byPath[p];if(!f)return docView(null);const c=card(f);const id=p.split('/')[1];
  const tasks=openTop(id);
  const files=D.files.filter(g=>g.path.startsWith(`projects/${id}/`)&&g.path!==p);
  const succ=c.successor&&projCard(c.successor);
  return `<div class="doc"><h2 class="dh">${esc(c.name||id)}</h2><div class="cap">${esc([c.status||'active',c.vector?VEC[c.vector]||c.vector:''].filter(Boolean).join(' · '))}</div>
  <div class="md"><p>${esc(c.what||'')}</p></div>${succ?lab('Replaced by',`<a href="#project/${encodeURIComponent(succ.path)}">${esc(card(succ).name||c.successor)}</a>`):''}
  ${c.aliases||c.repo||c.mac?`<details class="orig"><summary>Project details</summary>${lab('Also called',esc(c.aliases||''))}${lab('Repo',esc(c.repo||''))}${lab('Mac folder',esc(c.mac||''))}</details>`:''}</div>
  <div class="group">Open tasks <span class="n">${tasks.length}</span></div>${tasks.length?`<div class="list">${tasks.map(taskRow).join('')}</div>`:'<p class="meta">No open tasks.</p>'}
  ${files.length?`<div class="group">Files <span class="n">${files.length}</span></div><div class="list">${files.map(g=>row(`#f/${encodeURIComponent(g.path)}`,esc(title(g)),esc(preview(g)),'')).join('')}</div>`:''}`;
}
function agentView(n){const a=byPath[`agents/${n}/agent.md`],m=byPath[`agents/${n}/memory.md`];
  const data=D.files.filter(f=>f.path.startsWith(`agents/${n}/data/`));
  const need=[a,m].filter(f=>f&&D.lite&&!f.text&&!f.loaded);need.forEach(f=>loadFile(f.path));
  const ml=!m?[]:(m.text||m.loaded||!D.lite)?memLines(m.text):null;
  const dated=ml?ml.filter(x=>x.iso).sort((x,y)=>y.iso.localeCompare(x.iso)):[],undated=ml?ml.filter(x=>!x.iso):[];
  return `${a?`<div class="list">${row(`#f/${encodeURIComponent(a.path)}`,'Instructions',esc(stripFront(a.text||a.preview||'').replace(/^#.*\n/,'').replace(/[#*_`]/g,'').trim().slice(0,160)),'')}</div>`:''}
  <div class="group">Memory <span class="n">${ml?ml.length:''}</span></div>${ml?(ml.length?`<div class="list">${dated.map(x=>`<div class="row"><div class="m">${esc(dshow(x.iso))}</div><div>${esc(x.text)}</div></div>`).join('')}${undated.map(x=>`<div class="row"><div class="m">no date</div><div>${esc(x.text)}</div></div>`).join('')}</div>`:`<p class="meta">${m?'Empty.':'No memory saved yet.'}</p>`):'<p class="loading"><span class="spin"></span>Loading…</p>'}
  ${data.length?`<div class="group">Attachments <span class="n">${data.length}</span></div><div class="list">${data.map(f=>row(`#f/${encodeURIComponent(f.path)}`,esc(f.meta.title||heading(f)||f.path.split('/').pop().replace(/\.md$/,'').replace(/-/g,' ')),'',esc(f.path.split('/').pop()))).join('')}</div>`:''}`;
}

// notes list with search: titles and text; full-text search covers originals once the full copy is here
function notesList(){
  const q=(queries.notes||'').trim().toLowerCase();const el=$('nl');if(!el)return;
  const hay=f=>(title(f)+' '+(f.text||f.preview||'')+' '+(f.meta.original||'')).toLowerCase();
  const list=q?D.notes.filter(f=>hay(f).includes(q)):D.notes;
  const other=q?D.files.filter(f=>!f.path.startsWith('brain/')&&hay(f).includes(q)):[];
  el.innerHTML=(q?`<p class="meta">${list.length} notes${D.lite?' (searching titles and first lines while the full copy downloads)':''}</p>`:'')+
    (list.length?`<div class="list">${list.slice(0,400).map(f=>row(`#f/${encodeURIComponent(f.path)}`,esc(title(f)),esc(preview(f)),esc(dshow(pDate(f))))).join('')}</div>`:q?'':'<p class="empty">No notes.</p>')+
    (other.length?`<div class="group">Elsewhere <span class="n">${other.length}</span></div><div class="list">${other.slice(0,60).map(f=>row(`#f/${encodeURIComponent(f.path)}`,esc(title(f)),'',esc(f.path))).join('')}</div>`:'');
}
function filterRows(){const q=(queries.tasks||'').trim().toLowerCase();document.querySelectorAll('#out .row').forEach(x=>x.classList.toggle('hide',!!q&&!x.dataset.q.includes(q)));
  document.querySelectorAll('#out .list').forEach(l=>{const any=l.querySelector('.row:not(.hide)');l.classList.toggle('hide',!any);const h=l.previousElementSibling;if(h&&h.classList.contains('lvlh'))h.classList.toggle('hide',!any)});
  document.querySelectorAll('#out .sec').forEach(s=>s.classList.toggle('hide',!s.querySelector('.list:not(.hide)')))}

// ---------- routing ----------
function cur(){const h=decodeURIComponent(location.hash.slice(1))||(TABS.includes(store.get('cc-last'))?store.get('cc-last'):'tasks');const i=h.indexOf('/');return i<0?{view:h,arg:''}:{view:h.slice(0,i),arg:h.slice(i+1)}}
let lastTab='tasks';
function tabOf(v,arg){if(TABS.includes(v))return v;if(v==='task')return lastTab==='projects'?'projects':'tasks';if(v==='project')return lastTab==='tasks'?'tasks':'projects';if(v==='agent')return 'agents';
  if(v==='f'){if(arg.startsWith('brain/'))return 'notes';if(arg.startsWith('agents/'))return 'agents';if(arg.startsWith('projects/'))return 'projects';if(TABS.includes(lastTab))return lastTab;return 'system'}return 'tasks'}
function render(keep){
  if(!D){return}
  const {view,arg}=cur();const route=view+'/'+arg;
  if(!keep&&lastRoute)scrolls[lastRoute]=scrollY;
  const tab=tabOf(view,arg);if(TABS.includes(view)){store.set('cc-last',view)}lastTab=tab;
  const isTab=TABS.includes(view);
  let html='',ttl=TITLES[view]||'ContextCore';
  if(view==='task'){html=taskView(arg);ttl='Task'}
  else if(view==='f'){const f=byPath[arg];html=docView(f,SYS[arg]||'');ttl=f?(arg==='user.md'?'About you':arg==='agents.md'?'Shared rules':arg==='access.yaml'?'Agent rights':(heading(f)||title(f))):'Not found'}
  else if(view==='project'){html=projectView(arg);ttl=(byPath[arg]&&card(byPath[arg]).name)||'Project'}
  else if(view==='agent'){html=agentView(arg);ttl=arg?arg[0].toUpperCase()+arg.slice(1):'Agent'}
  else html=(V[view]||V.tasks)();
  $('title').textContent=ttl;document.title=ttl+' · ContextCore';
  $('back').classList.toggle('hide',isTab);
  $('hx').innerHTML=SEARCH[view]?`<input class="search" id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="${SEARCH[view]}">`:'';
  const q=$('q');if(q){q.value=queries[view]||'';q.addEventListener('input',e=>{queries[view]=e.target.value;view==='notes'?notesList():filterRows();scrollTo(0,0)})}
  $('out').innerHTML=html;
  if(view==='notes')notesList();else if(view==='tasks')filterRows();
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
  if(route!==lastRoute||!keep)scrollTo(0,scrolls[route]||0);
  lastRoute=route;showStatus();
}
$('back').onclick=()=>{if(history.length>1&&sessionStorage.getItem('cc-nav'))history.back();else location.hash=lastTab||'tasks'};
addEventListener('hashchange',()=>{try{sessionStorage.setItem('cc-nav','1')}catch{};render(false)});
// a tab tapped again: back to its top
document.getElementById('tabs').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&location.hash==='#'+a.dataset.t){e.preventDefault();scrollTo({top:0,behavior:'smooth'})}});
function size(d){const v=d===0?17:Math.min(24,Math.max(14,(parseInt(store.get('cc-fs'))||17)+d));store.set('cc-fs',v);document.documentElement.style.setProperty('--fs',v+'px')}
async function wipe(){if(!confirm('Delete the copy saved on this phone? It downloads again next time.'))return;await idbClear();try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch{};location.reload()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(false)});

// ---------- start ----------
(async()=>{
  const fs=parseInt(store.get('cc-fs'));if(fs)document.documentElement.style.setProperty('--fs',fs+'px');
  {const c=cur();if(c.view==='f'&&c.arg)early[c.arg]=getJSON('/v/api/file?p='+encodeURIComponent(c.arg)).catch(()=>null)}   // start the opened note at once, next to the list
  const saved=await idbGet('snap');
  if(saved&&saved.files){setData(saved);render(true)}
  sync(true);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/v/sw.js',{scope:'/v/'}).catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='shell-updated')location.reload()});
    const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()})}
})();
</script></body></html>
